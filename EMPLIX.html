<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EMPLIX 多语言产品讲解</title>
  <style>
    :root{
      --ink:#111318;--muted:#667085;--line:#e7e8ec;--paper:#fff;--wash:#f6f7f9;
      --accent:#5b35e8;--accent-soft:#f0edff;--dark:#151524;--radius:22px;
      --shadow:0 18px 50px rgba(26,25,43,.08);
      --mobile-scale:.45;--mobile-width:222.222%;--mobile-height:222.222dvh
    }
    *{box-sizing:border-box}
    html{min-width:100%;min-height:100%;scroll-behavior:smooth}
    body{position:relative;isolation:isolate;margin:0;background:#f7f8fc;color:var(--ink);font-family:Inter,"Noto Sans SC","Noto Sans TC","Microsoft YaHei",system-ui,sans-serif}
    body::before{
      content:"";position:fixed;z-index:-1;inset:0;width:100vw;height:100dvh;pointer-events:none;
      background:#f7f8fc
    }
    button,select{font:inherit}
    button{cursor:pointer}
    .shell{width:min(1120px,calc(100% - 96px));margin:auto}
    .presenter{
      position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.94);backdrop-filter:blur(18px)
    }
    .presenter-inner{min-height:72px;display:flex;align-items:center;gap:20px}
    .logo{margin-right:auto;font-size:22px;font-weight:800;letter-spacing:-.04em}
    .logo b{color:var(--accent)}
    .control{display:flex;align-items:center;gap:9px}
    .control label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    select{
      min-width:158px;padding:11px 38px 11px 13px;border:1px solid var(--line);
      border-radius:12px;background:var(--paper);color:var(--ink);font-weight:650
    }
    .print-btn{padding:11px 15px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
    .hero{padding:88px 0 56px}
    .hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:58px;align-items:center}
    .kicker{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:750}
    h1{max-width:760px;margin:20px 0 22px;font-size:clamp(48px,6vw,76px);line-height:1.06;letter-spacing:-.055em}
    .hero-copy{max-width:700px;margin:0;color:var(--muted);font-size:19px;line-height:1.75}
    .audience-note{display:flex;align-items:center;gap:12px;margin-top:30px;color:var(--muted);font-size:14px}
    .audience-note b{color:var(--ink)}
    .pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 7px var(--accent-soft)}
    .hero-ui{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}
    .hero-ui::before{content:"";position:absolute;z-index:4;inset:-1px;pointer-events:none;border-radius:inherit;border:1px solid rgba(91,53,232,.28);box-shadow:inset 0 0 30px rgba(91,53,232,.045),0 0 34px rgba(91,53,232,.10)}
    .hero-ui::after{content:"";position:absolute;z-index:3;left:-30%;top:-55%;width:42%;height:210%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(100,220,255,.12),transparent);transform:rotate(16deg) translateX(-180%)}
    .ui-top{height:48px;display:flex;align-items:center;gap:7px;padding:0 18px;border-bottom:1px solid var(--line)}
    .ui-top i{width:9px;height:9px;border-radius:50%;background:#d8d9df}.ui-top i:nth-child(2){background:#6b43ef}.ui-top i:nth-child(3){background:#51d9ff}
    .ui-top b{margin-left:auto;font-size:11px;letter-spacing:.1em}
    .ui-body{display:grid;grid-template-columns:70px 1fr;min-height:400px}
    .sidebar{display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 12px;background:var(--dark)}
    .sidebar strong{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff}
    .sidebar i{width:26px;height:8px;border-radius:8px;background:#fff;opacity:.18}.sidebar i.active{opacity:1;background:#8c75f4}
    .ui-content{padding:26px}
    .ui-head{display:flex;justify-content:space-between;gap:12px}
    .ui-head small{color:var(--accent);font-weight:750}.ui-head h3{margin:6px 0 0;font-size:18px}
    .review-badge{height:fit-content;padding:7px 9px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:750}
    .draft{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:15px}
    .draft small{color:var(--muted)}.draft h4{margin:18px 0 9px}.draft p{color:var(--muted);font-size:12px;line-height:1.65}
    .source{display:inline-block;padding:6px 8px;border-radius:7px;background:var(--wash);color:var(--muted);font-size:9px}
    .ui-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    .ui-actions button{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:10px;font-weight:700}
    .ui-actions button:first-child{border-color:var(--accent);background:var(--accent);color:#fff}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:58px}
    .metric{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
    .metric b{display:block;font-size:25px}.metric span{display:block;margin-top:7px;color:var(--muted);font-size:13px}
    section{padding:78px 0}
    .section-head{display:grid;grid-template-columns:.72fr 1.28fr;gap:40px;margin-bottom:38px}
    .section-head small{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .section-head h2{margin:0;font-size:clamp(34px,4vw,48px);line-height:1.14;letter-spacing:-.04em}
    .section-head p{grid-column:2;margin:0;color:var(--muted);font-size:17px;line-height:1.7}
    .white-section{background:var(--paper)}
    .workflow-stage{padding:24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--wash)}
    .workflow-nav{display:grid;grid-template-columns:repeat(8,1fr);gap:0;margin-bottom:24px}
    .flow-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:0 4px;border:0;background:transparent;color:var(--muted)}
    .flow-node::after{content:"";position:absolute;top:18px;left:60%;width:80%;height:2px;background:var(--line)}
    .flow-node:last-child::after{display:none}
    .flow-node i{position:relative;z-index:1;display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--line);border-radius:50%;background:var(--paper);font-style:normal;font-size:11px;font-weight:800}
    .flow-node span{font-size:11px;font-weight:700;text-align:center}
    .flow-node.active{color:var(--accent)}.flow-node.active i{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 0 0 7px var(--accent-soft)}
    .flow-node.done i{border-color:var(--accent);color:var(--accent)}.flow-node.done::after{background:var(--accent)}
    .step-explorer{display:grid;grid-template-columns:1.02fr .98fr;min-height:410px;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
    .step-visual{padding:26px;background:var(--dark);color:#fff}
    .visual-toolbar{display:flex;align-items:center;justify-content:space-between;color:#a9aabb;font-size:11px}
    .visual-toolbar b{color:#fff;letter-spacing:.08em}
    .module-preview{margin-top:22px;padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:#1e1e31}
    .module-preview-head{display:flex;align-items:center;gap:12px}
    .module-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--accent);font-size:12px;font-weight:850}
    .module-preview-head div{display:flex;flex-direction:column;gap:4px}.module-preview-head small{color:#a9aabb}
    .real-screen-shell{margin-top:14px;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#fff}
    .real-screen-head{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:#1e1e31}
    .real-screen-head .module-icon{width:34px;height:34px;border-radius:10px}
    .real-screen-head .module-preview-head b{font-size:12px}.real-screen-head .module-preview-head small{font-size:9px}
    .live-label{padding:6px 8px;border-radius:7px;background:rgba(91,53,232,.3);color:#c8bfff;font-size:9px;font-weight:800;letter-spacing:.05em}
    .real-screen-viewport{position:relative;height:255px;overflow:hidden;background:#f3f6fa}
    .real-screen-viewport iframe{width:200%;height:510px;border:0;transform:scale(.5);transform-origin:top left;pointer-events:none;background:#f3f6fa}
    .screen-flow-caption{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:8px;margin-top:12px}
    .screen-flow-caption>div{min-height:62px;padding:10px 12px;border-radius:10px;background:#29293d}
    .screen-flow-caption small{color:#9fa0ad;font-size:9px}.screen-flow-caption b{display:block;margin-top:7px;font-size:10px;line-height:1.35}
    .screen-flow-caption>span{text-align:center;color:#9f8bf7;font-weight:900}
    .visual-flow{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:10px;margin-top:24px}
    .visual-box{min-height:108px;padding:15px;border-radius:12px;background:#29293d}
    .visual-box small{color:#a9aabb}.visual-box b{display:block;margin-top:14px;font-size:13px;line-height:1.45}
    .visual-arrow{text-align:center;color:#9f8bf7;font-size:22px}
    .control-gate{display:flex;align-items:center;gap:10px;margin-top:14px;padding:13px;border-radius:11px;background:rgba(91,53,232,.22);font-size:12px}
    .control-gate i{width:9px;height:9px;border-radius:50%;background:#9f8bf7}
    .step-info{display:flex;flex-direction:column;padding:34px}
    .step-info-top{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .step-counter{color:var(--accent);font-size:13px;font-weight:850;letter-spacing:.08em}
    .module-chip{padding:7px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:750}
    .step-info h3{margin:26px 0 12px;font-size:31px;letter-spacing:-.03em}.step-info>p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}
    .io-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
    .io-card{padding:15px;border:1px solid var(--line);border-radius:12px}.io-card small{color:var(--muted);font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.io-card b{display:block;margin-top:9px;font-size:13px;line-height:1.45}
    .step-controls{display:flex;justify-content:flex-end;gap:8px;margin-top:auto;padding-top:20px}.step-controls button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}.step-controls button:last-child{border-color:var(--accent);background:var(--accent);color:#fff}.step-controls button:disabled{cursor:not-allowed;opacity:.35}
    .focus-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .focus-card{position:relative;display:grid;grid-template-columns:1fr 128px;gap:22px;align-items:center;overflow:hidden;min-height:220px;padding:26px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
    .focus-card::after{content:"";position:absolute;left:0;bottom:0;width:var(--meter,70%);height:5px;background:var(--accent)}
    .focus-card>b{position:absolute;left:26px;top:26px;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12px}
    .focus-copy{padding-top:42px}
    .focus-card h3{margin:0 0 10px;font-size:22px}.focus-card p{margin:0;color:var(--muted);line-height:1.65}
    .focus-visual{display:grid;place-items:center;width:124px;height:124px;border-radius:30px;background:linear-gradient(145deg,#f7f4ff,#ece7ff);color:var(--accent)}
    .focus-visual svg{width:82px;height:82px}.focus-visual .soft{fill:#ddd5ff}.focus-visual .paper{fill:#fff;stroke:#c8bbff;stroke-width:2}
    .focus-visual .line{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.focus-visual .dot{fill:currentColor}
    .scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .scenario{display:flex;flex-direction:column;min-height:350px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
    .scenario small{color:var(--accent);font-weight:750}.scenario h3{margin:16px 0 20px;font-size:23px}
    .scenario-visual{
      position:relative;display:grid;place-items:center;height:150px;margin:0 0 18px;overflow:hidden;
      border:1px solid #e8e3ff;border-radius:16px;
      background:
        radial-gradient(circle at 18% 22%,rgba(91,53,232,.10) 0 3px,transparent 4px),
        radial-gradient(circle at 82% 76%,rgba(91,53,232,.09) 0 4px,transparent 5px),
        linear-gradient(145deg,#faf9ff,#f2efff)
    }
    .scenario-visual::before,.scenario-visual::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(91,53,232,.12)}
    .scenario-visual::before{width:118px;height:118px;left:-44px;bottom:-62px}
    .scenario-visual::after{width:88px;height:88px;right:-28px;top:-42px}
    .scenario-visual svg{width:82%;height:118px;color:var(--accent)}
    .scenario-visual .soft{fill:#e9e3ff}.scenario-visual .paper{fill:#fff;stroke:#cfc4ff;stroke-width:2}
    .scenario-visual .line{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .scenario-visual .thin{fill:none;stroke:#9d89ef;stroke-width:1.8;stroke-linecap:round}
    .scenario-visual .dot{fill:currentColor}
    .journey{display:grid;gap:8px;margin-top:auto}
    .journey-node{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;padding:12px;border-radius:11px;background:var(--wash)}
    .journey-node i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-style:normal;font-size:10px;font-weight:850}
    .journey-node b{font-size:12px;line-height:1.45}.journey-arrow{text-align:center;color:var(--accent);font-weight:900;line-height:10px}
    .journey-outcome{margin-top:14px;padding:13px;border:1px solid #dcd5ff;border-radius:11px;color:var(--ink);background:var(--accent-soft);font-size:12px;line-height:1.5}
    .talk{display:grid;grid-template-columns:.68fr 1.32fr;gap:54px;padding:42px;border-radius:var(--radius);background:var(--dark);color:#fff}
    .talk-copy h2{margin:16px 0 14px;font-size:38px;line-height:1.17}.talk-copy p{color:#b9bac5;line-height:1.65}
    .talk-list{display:grid;gap:0}
    .talk-row{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12)}
    .talk-row:last-child{border-bottom:0}.talk-row>span{color:#a993ff;font-weight:800}.talk-row div{display:flex;flex-direction:column;gap:4px}
    .talk-row div span{color:#b9bac5;font-size:13px}.talk-row em{color:#a8a9b4;font-size:12px;font-style:normal}
    .closing{padding:80px 0 100px}
    .closing-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:70px;align-items:center}
    .closing-copy{text-align:left}
    .closing-copy .kicker{margin-bottom:18px}
    .closing h2{max-width:650px;margin:0 0 18px;font-size:clamp(38px,4.4vw,58px);line-height:1.08;letter-spacing:-.05em}
    .closing p{max-width:590px;margin:0;color:var(--muted);font-size:17px;line-height:1.72}
    .pilot-panel{padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--paper);box-shadow:var(--shadow)}
    .pilot-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .pilot-head b{font-size:13px;letter-spacing:.08em}.pilot-head span{padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800}
    .pilot-steps{display:grid;gap:12px}
    .pilot-step{display:grid;grid-template-columns:48px 1fr auto;gap:15px;align-items:center;padding:17px;border-radius:15px;background:var(--wash)}
    .pilot-step>i{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--dark);color:#fff;font-style:normal;font-size:12px;font-weight:850}
    .pilot-step b{display:block;margin-bottom:4px;font-size:15px}.pilot-step small{color:var(--muted);font-size:12px;line-height:1.5}
    .pilot-step>span{color:var(--accent);font-size:19px;font-weight:900}
    .pilot-result{display:flex;align-items:center;gap:12px;margin-top:17px;padding:15px 17px;border:1px solid #dcd5ff;border-radius:14px;background:var(--accent-soft);font-size:13px;font-weight:750}
    .pilot-result i{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal}
    .module-map{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
    .module-map-card{position:relative;min-height:122px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);text-align:left}
    .module-map-card i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-style:normal;font-size:11px;font-weight:850}
    .module-map-card b{display:block;margin-top:18px;font-size:15px}.module-map-card span{display:block;margin-top:7px;color:var(--muted);font-size:11px;line-height:1.5}
    .module-map-card::after{content:"";position:absolute;right:14px;top:17px;width:5px;height:5px;border-radius:50%;background:#55d4ff;box-shadow:0 0 12px #55d4ff}
    .module-map-card.active{border-color:var(--accent);background:linear-gradient(145deg,#fff,#f2efff);box-shadow:0 12px 30px rgba(91,53,232,.13)}
    .detail-dock{display:grid;grid-template-columns:160px 1fr 1fr 1fr;gap:16px;align-items:center;margin-top:16px;padding:18px 20px;border:1px solid rgba(91,53,232,.18);border-radius:17px;background:linear-gradient(135deg,#171629,#211a43);color:#fff}
    .detail-dock-title small{display:block;color:#6edbff;font:800 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em}.detail-dock-title b{display:block;margin-top:9px;font-size:18px}
    .detail-cell{padding-left:16px;border-left:1px solid rgba(255,255,255,.13)}.detail-cell small{display:block;color:#aeb1c2;font-size:9px;font-weight:800;letter-spacing:.08em}.detail-cell b{display:block;margin-top:8px;font-size:11px;line-height:1.55}
    .workforce{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
    .employee-card{position:relative;min-height:275px;padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(155deg,#fff,#f8f6ff);color:var(--ink);text-align:left}
    .employee-avatar{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#6b43ef,#4c29d3);color:#fff;font-size:12px;font-weight:850;box-shadow:0 10px 22px rgba(91,53,232,.23)}
    .employee-card h3{margin:20px 0 8px;font-size:18px}.employee-card>p{min-height:58px;margin:0;color:var(--muted);font-size:12px;line-height:1.55}
    .employee-tasks{display:grid;gap:7px;margin-top:20px}.employee-tasks span{padding:9px 10px;border-radius:9px;background:var(--wash);font-size:11px;font-weight:700}
    .employee-control{position:absolute;left:20px;right:20px;bottom:18px;display:flex;align-items:center;gap:7px;color:var(--accent);font-size:10px;font-weight:800}
    .employee-control i{width:7px;height:7px;border-radius:50%;background:#55d4ff;box-shadow:0 0 10px #55d4ff}
    .employee-card.active{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 18px 38px rgba(91,53,232,.14)}
    .employee-detail{grid-template-columns:150px 1fr 1fr 1fr}
    .dynamic-slides{display:contents}
    .deep-layout{display:grid;grid-template-columns:.72fr 1.28fr;gap:28px}
    .deep-identity,.deep-content{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(150deg,#fff,#f8f6ff)}
    .deep-avatar{display:grid;place-items:center;width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#6b43ef,#4021bd);color:#fff;font-size:19px;font-weight:900;box-shadow:0 14px 32px rgba(91,53,232,.25)}
    .deep-identity h3{margin:25px 0 10px;font-size:30px}.deep-identity p{color:var(--muted);line-height:1.65}
    .deep-status{display:flex;align-items:center;gap:9px;margin-top:28px;color:#148b67;font-size:11px;font-weight:850}.deep-status i{width:8px;height:8px;border-radius:50%;background:#3ad5a1;box-shadow:0 0 12px #3ad5a1}
    .deep-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.deep-block{padding:17px;border-radius:14px;background:var(--wash)}
    .deep-block small{color:var(--accent);font-size:10px;font-weight:850;letter-spacing:.08em}.deep-block b{display:block;margin-top:9px;font-size:13px;line-height:1.55}

    @media(prefers-reduced-motion:no-preference){
      .pulse{animation:techPulse 2.4s ease-in-out infinite}
      @keyframes techPulse{50%{box-shadow:0 0 0 10px rgba(91,53,232,.07),0 0 22px rgba(91,53,232,.28)}}
      .deck::before{animation:ambientA 11s ease-in-out infinite alternate}.deck::after{animation:ambientB 13s ease-in-out infinite alternate}
      @keyframes ambientA{to{transform:translate(8vw,5vh) scale(1.12)}}@keyframes ambientB{to{transform:translate(-7vw,-6vh) scale(.9)}}
      .slide.is-entering .section-head>*{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) both}.slide.is-entering .section-head h2{animation-delay:.06s}.slide.is-entering .section-head p{animation-delay:.12s}

      .slide.is-entering .module-map-card:nth-child(2),.slide.is-entering .employee-card:nth-child(2),.slide.is-entering .focus-card:nth-child(2),.slide.is-entering .scenario:nth-child(2){animation-delay:.06s}
      .slide.is-entering .module-map-card:nth-child(3),.slide.is-entering .employee-card:nth-child(3),.slide.is-entering .focus-card:nth-child(3),.slide.is-entering .scenario:nth-child(3){animation-delay:.12s}
      .slide.is-entering .module-map-card:nth-child(n+4),.slide.is-entering .employee-card:nth-child(n+4),.slide.is-entering .focus-card:nth-child(4){animation-delay:.18s}

      @keyframes riseIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}@keyframes scanLine{to{transform:translateY(500%)}}
      .module-map-card,.employee-card,.focus-card,.scenario,.pilot-step,.value-tile,.io-card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
      .module-map-card:hover,.employee-card:hover,.focus-card:hover,.scenario:hover{transform:translateY(-5px);border-color:rgba(91,53,232,.35);box-shadow:0 22px 48px rgba(35,28,72,.13)}
      .hero-ui,.system-capture,.focus-visual,.scenario-visual{transform:translate(var(--px,0),var(--py,0));transition:transform .18s ease-out}
      .flow-node.active i{animation:nodePulse 1.8s ease-in-out infinite}
      @keyframes nodePulse{50%{box-shadow:0 0 0 10px rgba(91,53,232,.08),0 0 28px rgba(91,53,232,.38)}}
      .slide.active .hero-ui{animation:deskFloat 4.8s ease-in-out infinite,deskGlow 3.2s ease-in-out infinite}
      .slide.active .hero-ui::after{animation:deskScan 5.4s 1s ease-in-out infinite}
      .slide.active .hero-ui .ui-top i:nth-child(3){animation:onlinePulse 1.8s ease-in-out infinite}
      @keyframes deskFloat{0%,100%{translate:0 0}50%{translate:0 -8px}}
      @keyframes deskGlow{0%,100%{box-shadow:0 18px 50px rgba(26,25,43,.08),0 0 0 rgba(91,53,232,0)}50%{box-shadow:0 26px 58px rgba(41,29,98,.16),0 0 34px rgba(91,53,232,.13)}}
      @keyframes deskScan{0%,18%{transform:rotate(16deg) translateX(-180%)}58%,100%{transform:rotate(16deg) translateX(520%)}}

    }

    @media (orientation:landscape) and (pointer:coarse),(orientation:landscape) and (max-height:600px){

      }

<body>
  <div class="orientation-hint" role="dialog" aria-label="请横屏观看">
    <div class="rotate-device" aria-hidden="true"></div>
    <b id="orientationTitle">请横屏观看</b>
    <p id="orientationCopy">为了完整显示系统界面和操作流程，请将手机旋转至横屏。</p>
    <small>ROTATE FOR BEST VIEW</small>
  </div>
  <div class="presentation-stage">
  <header class="presenter">
    <div class="shell presenter-inner">
      <div class="logo"><b>EM</b>PLIX</div>
      <div class="control">
        <label id="languageLabel" for="language">演讲语言</label>
        <select id="language">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="control">
        <label id="audienceLabel" for="audience">演讲对象</label>
        <select id="audience"></select>
      </div>
      <div class="mobile-scale-control" aria-label="调整页面缩放">
        <button type="button" id="scaleDown" aria-label="缩小">−</button>
        <span id="scaleValue">45%</span>
        <button type="button" id="scaleUp" aria-label="放大">＋</button>
      </div>
      <button class="print-btn" id="printBtn" type="button">打印 / PDF</button>
      <button class="fullscreen-btn" id="fullscreenBtn" type="button">全屏</button>
    </div>
  </header>

  <main class="deck">
    <section class="hero slide active" data-slide="0">
      <div class="shell">
       <div class="hero-grid">
        <div>
          <span class="kicker" id="kicker"></span>
          <h1 id="heroTitle"></h1>
          <p class="hero-copy" id="heroCopy"></p>
          <div class="audience-note"><i class="pulse"></i><span id="audienceNote"></span></div>
        </div>
        <div class="hero-ui" aria-label="EMPLIX approval desk preview">
          <div class="ui-top"><i></i><i></i><i></i><b>EMPLIX</b></div>
          <div class="ui-body">
            <aside class="sidebar"><strong>E</strong><i></i><i class="active"></i><i></i><i></i><i></i></aside>
            <div class="ui-content">
              <div class="ui-head"><div><small>MY DESK</small><h3 id="uiReviewTitle"></h3></div><span class="review-badge" id="uiWaiting"></span></div>
              <div class="draft">
                <small id="uiAssistant"></small>
                <h4 id="uiDraftTitle"></h4>
                <p id="uiDraftBody"></p>
                <span class="source" id="uiSource"></span>
              </div>
              <div class="ui-actions"><button id="uiApprove"></button><button id="uiEdit"></button><button id="uiReject"></button></div>
            </div>
          </div>
        </div>
       </div>
       <div class="metrics" id="metrics"></div>
      </div>
    </section>

    <section class="white-section slide" data-slide="module-map">
      <div class="shell">
        <div class="section-head">
          <small id="mapLabel"></small>
          <h2 id="mapTitle"></h2>
          <p id="mapIntro"></p>
        </div>
        <div class="module-map" id="moduleMap"></div>
        <div class="detail-dock" id="moduleDetail"></div>
      </div>
    </section>

    <section class="slide" data-slide="workforce">
      <div class="shell">
        <div class="section-head">
          <small id="workforceLabel"></small>
          <h2 id="workforceTitle"></h2>
          <p id="workforceIntro"></p>
        </div>
        <div class="workforce" id="workforceGrid"></div>
        <div class="detail-dock employee-detail" id="workforceDetail"></div>
      </div>
    </section>

    <div class="dynamic-slides" id="employeeSlides"></div>
    <div class="dynamic-slides" id="moduleSlides"></div>

    <section class="white-section slide" data-slide="1">
      <div class="shell">
        <div class="section-head">
          <small id="workflowLabel"></small>
          <h2 id="workflowTitle"></h2>
          <p id="workflowIntro"></p>
        </div>
        <div class="workflow-stage">
          <div class="workflow-nav" id="workflow"></div>
          <div class="step-explorer">
            <div class="step-visual">
              <div class="visual-toolbar"><b>EMPLIX</b><span id="visualStage"></span></div>
              <div class="real-screen-shell">
                <div class="real-screen-head">
                  <div class="module-preview-head">
                    <span class="module-icon" id="moduleIcon"></span>
                    <div><b id="moduleName"></b><small id="moduleHint"></small></div>
                  </div>
                  <span class="live-label" id="realPageLabel"></span>
                </div>
                <div class="real-screen-viewport">
                  <iframe id="realScreen" title="EMPLIX real system page" loading="eager"></iframe>
                </div>
              </div>
              <div class="screen-flow-caption">
                <div><small id="inputLabel"></small><b id="visualInput"></b></div>
                <span>→</span>
                <div><small id="outputLabel"></small><b id="visualOutput"></b></div>
              </div>
            </div>
            <div class="step-info">
              <div class="step-info-top"><span class="step-counter" id="stepCounter"></span><span class="module-chip" id="stepModule"></span></div>
              <h3 id="stepTitle"></h3>
              <p id="stepDescription"></p>
              <div class="io-grid">
                <div class="io-card"><small id="actionLabel"></small><b id="stepAction"></b></div>
                <div class="io-card"><small id="guardLabel"></small><b id="stepGuard"></b></div>
              </div>
              <div class="step-controls"><button type="button" id="prevStep"></button><button type="button" id="nextStep"></button></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="slide" data-slide="2">
      <div class="shell">
        <div class="section-head">
          <small id="focusLabel"></small>
          <h2 id="focusTitle"></h2>
          <p id="focusIntro"></p>
        </div>
        <div class="focus-grid" id="focusGrid"></div>
      </div>
    </section>

    <section class="slide" data-slide="governance">
      <div class="shell">
        <div class="section-head">
          <small id="governanceLabel"></small>
          <h2 id="governanceTitle"></h2>
          <p id="governanceIntro"></p>
        </div>
        <div class="governance-grid">
          <div class="control-stack">
            <span class="panel-label" id="controlPanelLabel"></span>
            <h3 id="controlPanelTitle"></h3>
            <div id="controlRows"></div>
          </div>
          <div class="value-console">
            <span class="panel-label" id="valuePanelLabel"></span>
            <h3 id="valuePanelTitle"></h3>
            <div class="value-metrics" id="valueMetrics"></div>
            <div class="audit-line"><i></i><span id="auditLine"></span></div>
          </div>
        </div>
      </div>
    </section>

    <section class="white-section slide" data-slide="3">
      <div class="shell">
        <div class="section-head">
          <small id="scenarioLabel"></small>
          <h2 id="scenarioTitle"></h2>
          <p id="scenarioIntro"></p>
        </div>
        <div class="scenarios" id="scenarios"></div>
      </div>
    </section>

    <section class="speaker-notes" aria-hidden="true">
      <div class="shell">
        <div class="talk">
          <div class="talk-copy">
            <span class="kicker" id="talkLabel"></span>
            <h2 id="talkTitle"></h2>
            <p id="talkIntro"></p>
          </div>
          <div class="talk-list" id="talkList"></div>
        </div>
      </div>
    </section>

    <div class="shell closing slide" data-slide="5">
      <div class="closing-grid">
        <div class="closing-copy">
          <span class="kicker" id="closingLabel"></span>
          <h2 id="closingTitle"></h2>
          <p id="closingCopy"></p>
        </div>
        <div class="pilot-panel">
          <div class="pilot-head"><b id="pilotTitle"></b><span id="pilotDuration"></span></div>
          <div class="pilot-steps" id="pilotSteps"></div>
          <div class="pilot-result"><i>✓</i><span id="pilotResult"></span></div>
        </div>
      </div>
    </div>
  </main>
  <footer><div class="shell"><b>EMPLIX</b><span id="footerText"></span></div></footer>
  <div class="deck-controls" aria-label="Presentation controls">
    <button type="button" id="prevSlide" aria-label="Previous slide">←</button>
    <div class="slide-status"><span id="slideTitle"></span><b id="slideCounter"></b></div>
    <div class="deck-progress"><i id="deckProgress"></i></div>
    <button type="button" id="nextSlide" aria-label="Next slide">→</button>
  </div>
  </div>

  <script>
    const workflowData = {
      "zh-CN":[
        ["治理配置","确认权限、团队角色与 Sandbox 状态。"],["资料准备","上传批准文件并限定应用授权范围。"],
        ["员工配置","设置任务能力、审批规则与工作指令。"],["发起任务","选择模板或新建工作单，明确验收条件。"],
        ["AI 执行","根据输入、指令与批准资料生成草稿。"],["人工审批","核对来源、事实、金额、语气与目标对象。"],
        ["执行归档","批准后发送、保存或继续下游动作。"],["审计复盘","在 History 与 Value 中核验留痕和价值。"]

      $("stepTitle").textContent=summary[0];$("stepDescription").textContent=summary[1];
      $("actionLabel").textContent=labels.action;$("guardLabel").textContent=labels.guard;
      $("stepAction").textContent=step[5];$("stepGuard").textContent=step[6];
      $("prevStep").textContent=labels.prev;$("nextStep").textContent=labels.next;
      $("prevStep").disabled=currentStep===0;$("nextStep").disabled=currentStep===7;
      document.querySelectorAll(".flow-node").forEach((node,i)=>{
        node.classList.toggle("active",i===currentStep);node.classList.toggle("done",i<currentStep);
      });
    }
    lang=localStorage.getItem("emplix-lang")||lang;
    audience=localStorage.getItem("emplix-audience")||audience;
    $("language").value=lang;
    $("language").addEventListener("change",e=>{lang=e.target.value;render()});
    $("audience").addEventListener("change",e=>{audience=e.target.value;currentSlide=0;currentStep=0;render()});
    $("scaleDown").addEventListener("click",()=>{mobileScale=Math.max(.35,Math.round((mobileScale-.05)*100)/100);applyMobileScale()});
    $("scaleUp").addEventListener("click",()=>{mobileScale=Math.min(.65,Math.round((mobileScale+.05)*100)/100);applyMobileScale()});
    $("moduleMap").addEventListener("click",e=>{const card=e.target.closest("[data-module-index]");if(card){const deepOrder=[7,6,4,1,2,3,8,5,0,9];currentSlide=8+deepOrder[Number(card.dataset.moduleIndex)];updateSlides()}});
    $("workforceGrid").addEventListener("click",e=>{const card=e.target.closest("[data-employee-index]");if(card){currentSlide=3+Number(card.dataset.employeeIndex);updateSlides()}});
    $("workflow").addEventListener("click",e=>{const button=e.target.closest("[data-step]");if(button){currentStep=Number(button.dataset.step);renderStep()}});
    $("prevStep").addEventListener("click",()=>{if(currentStep>0){currentStep--;renderStep()}});
    $("nextStep").addEventListener("click",()=>{if(currentStep<7){currentStep++;renderStep()}});
    $("prevSlide").addEventListener("click",()=>goSlide(-1));
    $("nextSlide").addEventListener("click",()=>goSlide(1));
    $("fullscreenBtn").addEventListener("click",async()=>{if(!document.fullscreenElement){await document.documentElement.requestFullscreen?.()}else{await document.exitFullscreen?.()}});
    document.addEventListener("pointermove",e=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const x=(e.clientX/innerWidth-.5)*8,y=(e.clientY/innerHeight-.5)*8;document.documentElement.style.setProperty("--px",`${x}px`);document.documentElement.style.setProperty("--py",`${y}px`)});
    document.addEventListener("pointerleave",()=>{document.documentElement.style.setProperty("--px","0px");document.documentElement.style.setProperty("--py","0px")});
    document.addEventListener("keydown",e=>{
      if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();goSlide(1)}
      if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();goSlide(-1)}
      if(e.key==="Home"){currentSlide=0;updateSlides()}
      if(e.key==="End"){currentSlide=document.querySelectorAll(".slide").length-1;updateSlides()}
    });
    $("printBtn").addEventListener("click",()=>window.print());
    applyMobileScale();
    render();
  </script>
</body>
</html>
